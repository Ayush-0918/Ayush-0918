<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02000a"/>
      <stop offset="40%" stop-color="#050314"/>
      <stop offset="80%" stop-color="#0b0622"/>
      <stop offset="100%" stop-color="#140b38"/>
    </linearGradient>

    <!-- Space Nebulas for WOW Factor -->
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00cec9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Text Glow Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="30%" stop-color="#00cec9"/>
      <stop offset="70%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#a29bfe"/>
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 3D Card Edge & Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="40%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#ff7675"/>
    </linearGradient>

    <linearGradient id="cardSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c072b"/>
      <stop offset="100%" stop-color="#040212"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2c2266" stroke-width="0.8" opacity="0.25"/>
      <circle cx="0" cy="0" r="1.2" fill="#00cec9" opacity="0.2"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Outfit:wght@400;600;800&amp;display=swap');
      
      .name-text {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 62px;
        fill: url(#nameGrad);
        letter-spacing: 2px;
      }
      
      .subtitle-text {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #d5d1ff;
        letter-spacing: 4px;
        opacity: 0.9;
      }
      
      .tech-badge {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #00cec9;
        font-weight: 700;
      }

      .term-text {
        font-family: 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #e0dbff;
        line-height: 1.5;
      }

      .term-cmd { fill: #f8a5c2; font-weight: 700; }
      .term-param { fill: #78e08f; }
      .term-string { fill: #f7d794; }
      .term-val { fill: #63cdda; }
      .term-comment { fill: #5f27cd; font-style: italic; }

      /* Keyframes */
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotateX(15deg) rotateY(-18deg) rotateZ(4deg); }
        50% { transform: translateY(-12px) rotateX(12deg) rotateY(-14deg) rotateZ(3deg); }
      }

      @keyframes shadowPulse {
        0%, 100% { opacity: 0.5; transform: scale(1) translateY(0px); }
        50% { opacity: 0.3; transform: scale(0.92) translateY(5px); }
      }

      @keyframes neonPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }

      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
        50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      }

      @keyframes waveFlow {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-400px); }
      }

      @keyframes nodeSignal {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .terminal-3d-wrapper {
        transform-style: preserve-3d;
        transform: rotateX(15deg) rotateY(-18deg) rotateZ(4deg);
        animation: float3D 6s infinite ease-in-out;
      }

      .shadow-3d {
        transform: rotateX(15deg) rotateY(-18deg) rotateZ(4deg) translateZ(-40px);
        animation: shadowPulse 6s infinite ease-in-out;
      }

      .glow-circuit { animation: neonPulse 4s infinite ease-in-out; }
      .particle-slow { animation: floatParticle 8s infinite ease-in-out; }
      .particle-fast { animation: floatParticle 5s infinite ease-in-out 1.5s; }
      
      .sine-wave {
        animation: waveFlow 10s infinite linear;
      }

      .signal-node {
        animation: nodeSignal 2s infinite ease-in-out;
        transform-origin: 275px 18px;
      }

      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background Layer Stack -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#nebulaCyan)"/>
  <rect width="1200" height="320" fill="url(#nebulaPurple)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Neural Connection Circuits -->
  <g stroke="url(#cardBorder)" stroke-width="1.2" fill="none" class="glow-circuit" opacity="0.5" filter="url(#subtleGlow)">
    <path d="M-20,70 L250,70 L290,110 L540,110 L580,70 L650,70" />
    <path d="M120,330 L220,230 L500,230 L540,270 L800,270" />
    <path d="M1120,330 L980,190 L900,190 L850,140 L720,140" />
    <path d="M1220,50 L1020,50 L950,120 L780,120" />
  </g>
  
  <g fill="#00cec9">
    <circle cx="290" cy="110" r="3.5" filter="url(#subtleGlow)"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="70" r="3.5" filter="url(#subtleGlow)"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="120" r="3.5" filter="url(#subtleGlow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Floating Particles (Pushed to safe boundaries to prevent overlapping text) -->
  <circle class="particle-slow" cx="80" cy="50" r="2.5" fill="#74b9ff"/>
  <circle class="particle-fast" cx="480" cy="270" r="2" fill="#a29bfe"/>
  <circle class="particle-slow" cx="620" cy="40" r="3" fill="#00cec9"/>
  <circle class="particle-fast" cx="1120" cy="260" r="2" fill="#ff7675"/>
  <circle class="particle-slow" cx="1080" cy="60" r="2.5" fill="#74b9ff"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 0)">
    <!-- Tech chips header -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="136" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="4.5" fill="#00cec9" filter="url(#subtleGlow)"/>
      <text x="24" y="16" class="tech-badge">STUDENT AT IITR</text>
    </g>
    
    <!-- Main Name -->
    <text x="0" y="132" class="name-text" filter="url(#subtleGlow)">AYUSH PANDEY</text>
    
    <!-- Subtitle -->
    <text x="0" y="176" class="subtitle-text">AI ENGINEER • DATA SCIENTIST</text>

    <!-- Accent terminal prompt capsule line (WOW factor widget) -->
    <g transform="translate(0, 212)">
      <!-- Background terminal capsule -->
      <rect x="-8" y="-18" width="372" height="28" rx="8" fill="#060312" fill-opacity="0.8" stroke="#22184a" stroke-width="1"/>
      <text font-family="'Fira Code', monospace" font-size="12" y="0">
        <tspan fill="#57606f" x="8">❯</tspan>
        <tspan fill="#00cec9" x="24">npm</tspan>
        <tspan fill="#d5d1ff" x="56">run</tspan>
        <tspan fill="#ff7675" x="86">build-awesome-things</tspan>
        <tspan fill="#a29bfe" x="270">--prod</tspan>
      </text>
    </g>
  </g>

  <!-- Right Content Column: True 3D Terminal -->
  <g transform="translate(685, 30)">
    <!-- 3D Shadow -->
    <g class="shadow-3d">
      <rect x="10" y="15" width="410" height="210" rx="16" fill="#000000" filter="url(#glow)" opacity="0.6"/>
    </g>

    <!-- 3D Terminal Container Group -->
    <g class="terminal-3d-wrapper">
      <!-- 3D Extrusion Side Wall Left -->
      <path d="M 0,0 L -8,6 L -8,216 L 0,210 Z" fill="url(#cardSide)" stroke="#180e44" stroke-width="0.5"/>
      <!-- 3D Extrusion Bottom Wall -->
      <path d="M 0,210 L -8,216 L 402,216 L 410,210 Z" fill="url(#cardSide)" stroke="#180e44" stroke-width="0.5"/>
      
      <!-- Main Window Face -->
      <rect width="410" height="210" rx="16" fill="#0a0520" fill-opacity="0.9" stroke="url(#cardBorder)" stroke-width="1.8" filter="url(#shadow)"/>
      <rect width="410" height="210" rx="16" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2"/>

      <!-- Inner Grid overlay for glass texture -->
      <path d="M 10 35 L 400 35" stroke="#2c2266" stroke-width="0.8"/>
      
      <!-- Terminal Header / Title Bar -->
      <g transform="translate(0, 0)">
        <!-- Window Controls -->
        <circle cx="20" cy="18" r="6" fill="#ff7675"/>
        <circle cx="38" cy="18" r="6" fill="#ffeaa7"/>
        <circle cx="56" cy="18" r="6" fill="#55efc4"/>
        
        <!-- Active System Status -->
        <circle class="signal-node" cx="275" cy="18" r="4.5" fill="#55efc4" filter="url(#subtleGlow)"/>
        <text x="286" y="21" font-family="'Fira Code', monospace" font-size="8" fill="#00cec9" font-weight="700">SYS: ACTIVE // MLOPS_ONLINE</text>

        <!-- Tabs -->
        <g transform="translate(90, 0)">
          <!-- Active tab -->
          <path d="M0,35 L8,10 L105,10 L113,35 Z" fill="#120835" stroke="#3e387c" stroke-width="0.8"/>
          <text x="56" y="24" font-family="'Fira Code', monospace" font-size="11" fill="#00cec9" font-weight="700" text-anchor="middle">profile.py</text>
        </g>
      </g>
      
      <!-- Code Area with Line Numbers (IDE Style) -->
      <g transform="translate(15, 62)" class="term-text">
        <!-- Line Numbers Column -->
        <g fill="#4a3e9c" font-size="10.5" text-anchor="end">
          <text x="0" y="0">1</text>
          <text x="0" y="18">2</text>
          <text x="0" y="36">3</text>
          <text x="0" y="54">4</text>
          <text x="0" y="72">5</text>
          <text x="0" y="90">6</text>
          <text x="0" y="108">7</text>
          <text x="0" y="126">8</text>
        </g>

        <!-- Code Content -->
        <g transform="translate(12, 0)">
          <!-- Line 1 -->
          <text x="0" y="0">
            <tspan class="term-cmd">class</tspan> <tspan fill="#ffffff">Developer</tspan>:
          </text>
          
          <!-- Line 2 -->
          <text x="14" y="18">
            <tspan class="term-cmd">def</tspan> <tspan fill="#74b9ff">__init__</tspan>(self):
          </text>
          
          <!-- Line 3 -->
          <text x="28" y="36">
            self.<tspan fill="#81ecec">name</tspan> = <tspan class="term-string">"Ayush Pandey"</tspan>
          </text>
          
          <!-- Line 4 -->
          <text x="28" y="54">
            self.<tspan fill="#81ecec">focus</tspan> = <tspan class="term-string">"AI &amp; MLOps"</tspan>
          </text>
          
          <!-- Line 5 -->
          <text x="28" y="72">
            self.<tspan fill="#81ecec">college</tspan> = <tspan class="term-string">"IIT Roorkee"</tspan>
          </text>
          
          <!-- Line 6 (empty spacer) -->
          <text x="14" y="90">
            <!-- empty line -->
          </text>
          
          <!-- Line 7 -->
          <text x="14" y="108">
            <tspan class="term-cmd">def</tspan> <tspan fill="#74b9ff">status</tspan>(self):
          </text>
          
          <!-- Line 8 -->
          <text x="28" y="126">
            <tspan class="term-cmd">return</tspan> <tspan class="term-string">"Always learning 🚀"</tspan>
          </text>
          
          <!-- Blinking Cursor -->
          <rect class="cursor" x="188" y="115" width="7" height="13" fill="#00cec9" filter="url(#subtleGlow)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Oscilloscope Sinus wave at bottom -->
  <g opacity="0.25">
    <path class="sine-wave" d="M 0,315 Q 100,300 200,315 T 400,315 T 600,315 T 800,315 T 1000,315 T 1200,315 T 1400,315 T 1600,315 T 1800,315" fill="none" stroke="#00cec9" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <path class="sine-wave" d="M 0,315 Q 100,300 200,315 T 400,315 T 600,315 T 800,315 T 1000,315 T 1200,315 T 1400,315 T 1600,315 T 1800,315" fill="none" stroke="#a29bfe" stroke-width="1.2" style="animation-delay: -3s;"/>
  </g>
</svg>
