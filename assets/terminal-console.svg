<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050316"/>
      <stop offset="100%" stop-color="#0b0825"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2266"/>
      <stop offset="50%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .term-txt {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #e0dbff;
      }
      
      .prompt { fill: #55efc4; font-weight: bold; }
      .lbl { fill: #a29bfe; font-weight: bold; }
      .val { fill: #ffffff; }
      .status-active { fill: #55efc4; font-weight: bold; }

      /* Blinking Cursor */
      .cursor {
        animation: blink 1s infinite;
        fill: #55efc4;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Sequential Typing/Reveal Animation */
      @keyframes reveal {
        to { opacity: 1; }
      }

      .l1 { opacity: 0; animation: reveal 0.1s forwards 0.2s; }
      .l2 { opacity: 0; animation: reveal 0.1s forwards 0.5s; }
      .l3 { opacity: 0; animation: reveal 0.1s forwards 0.8s; }
      .l4 { opacity: 0; animation: reveal 0.1s forwards 1.1s; }
      .l5 { opacity: 0; animation: reveal 0.1s forwards 1.4s; }
      .l6 { opacity: 0; animation: reveal 0.1s forwards 1.7s; }
      .l7 { opacity: 0; animation: reveal 0.1s forwards 2.0s; }
      .l8 { opacity: 0; animation: reveal 0.1s forwards 2.3s; }
      .l9 { opacity: 0; animation: reveal 0.1s forwards 2.6s; }
      .l10 { opacity: 0; animation: reveal 0.1s forwards 2.9s; }
      .l11 { opacity: 0; animation: reveal 0.1s forwards 3.2s; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="800" height="280" rx="10" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.8"/>
  
  <!-- Window Header / Title Bar -->
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 790,0 A 10,10 0 0,1 800,10 L 800,32 L 0,32 Z" fill="#0c072b" stroke="url(#termBorder)" stroke-width="0.8"/>
  <line x1="0" y1="32" x2="800" y2="32" stroke="#2c2266" stroke-width="1"/>

  <!-- Window Controls (Red, Yellow, Green Dots) -->
  <circle cx="20" cy="16" r="5" fill="#ff7675"/>
  <circle cx="36" cy="16" r="5" fill="#ffeaa7"/>
  <circle cx="52" cy="16" r="5" fill="#55efc4"/>

  <!-- Terminal Title -->
  <text x="400" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#00cec9" font-weight="bold" text-anchor="middle" letter-spacing="1">ayush@iHUB-IITR: ~</text>

  <!-- Terminal Output -->
  <g transform="translate(25, 60)" class="term-txt">
    <!-- Line 1: Prompt & Command -->
    <text x="0" y="0" class="l1">
      <tspan class="prompt">[ayush@iHUB-IITR ~]$</tspan> neofetch --3d-profile
    </text>

    <!-- Line 2: OS -->
    <text x="0" y="20" class="l2">
      <tspan class="lbl">OS</tspan>: <tspan class="val">macOS Sequoia 15.0 (AI Platform Developer Environment)</tspan>
    </text>

    <!-- Line 3: Host -->
    <text x="0" y="40" class="l3">
      <tspan class="lbl">Host</tspan>: <tspan class="val">iHUB DivyaSampark, IIT Roorkee</tspan>
    </text>

    <!-- Line 4: Kernel -->
    <text x="0" y="60" class="l4">
      <tspan class="lbl">Kernel</tspan>: <tspan class="val">AI &amp; Data Science Program</tspan>
    </text>

    <!-- Line 5: Shell -->
    <text x="0" y="80" class="l5">
      <tspan class="lbl">Shell</tspan>: <tspan class="val">zsh (customized-3d-console)</tspan>
    </text>

    <!-- Line 6: Uptime -->
    <text x="0" y="100" class="l6">
      <tspan class="lbl">Uptime</tspan>: <tspan class="val">20 yrs, 9 mos (Runtime: Always Learning)</tspan>
    </text>

    <!-- Line 7: Packages -->
    <text x="0" y="120" class="l7">
      <tspan class="lbl">Packages</tspan>: <tspan class="val">PyTorch, TensorFlow, OpenCV, FastAPI, Kotlin, Compose</tspan>
    </text>

    <!-- Line 8: Terminal -->
    <text x="0" y="140" class="l8">
      <tspan class="lbl">Terminal</tspan>: <tspan class="val">3D-Isometric-Terminal-Holo (Assets Active)</tspan>
    </text>

    <!-- Line 9: CPU -->
    <text x="0" y="160" class="l9">
      <tspan class="lbl">CPU</tspan>: <tspan class="val">Neural-Network-Model-Architect (8 Cores)</tspan>
    </text>

    <!-- Line 10: Memory -->
    <text x="0" y="180" class="l10">
      <tspan class="lbl">Memory</tspan>: <tspan class="val">Infinite-Curiosity / 100% Allocation</tspan>
    </text>

    <!-- Line 11: Status -->
    <text x="0" y="200" class="l11">
      <tspan class="lbl">Status</tspan>: <tspan class="status-active">🟢 ACTIVE // MLOPS_ONLINE // SOURCE_OPEN</tspan>
    </text>

    <!-- Blinking Cursor at the end -->
    <rect class="cursor l11" x="382" y="189" width="8" height="14"/>
  </g>
</svg>
