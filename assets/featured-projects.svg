<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02000a"/>
      <stop offset="100%" stop-color="#09071e"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f38"/>
      <stop offset="100%" stop-color="#09061a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accMoney" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>

    <linearGradient id="accTrust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>

    <linearGradient id="accPlant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#55efc4"/>
    </linearGradient>

    <linearGradient id="accAuth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>

    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00cec9" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d1742" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Outfit:wght@400;600;800&amp;display=swap');
      
      .title { 
        font-family: 'Outfit', -apple-system, sans-serif; 
        font-size: 23px; 
        font-weight: 800; 
        fill: #ffffff; 
      }
      
      .desc { 
        font-family: 'Outfit', -apple-system, sans-serif; 
        font-size: 13.5px; 
        fill: #c8c6f0; 
        line-height: 1.5;
      }
      
      .tag-text { 
        font-family: 'Fira Code', monospace; 
        font-size: 11px; 
        fill: #a29bfe; 
        font-weight: 500;
      }
      
      .badge-text { 
        font-family: 'Fira Code', monospace; 
        font-size: 10px; 
        font-weight: 700; 
        fill: #09061a; 
      }

      .vis-title {
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        fill: #8a86c9;
      }

      /* Hover and Glow Animations */
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      
      @keyframes scan {
        0% { transform: translateY(0px); }
        50% { transform: translateY(100px); }
        100% { transform: translateY(0px); }
      }

      @keyframes drawLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-node { animation: pulse 2s infinite ease-in-out; }
      .scanner-line { animation: scan 4s infinite ease-in-out; }
      
      .card-item {
        transition: all 0.3s ease;
      }
      .card-item:hover {
        stroke: #3e387c;
        transform: translateY(-4px);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- ============ CARD 1 : Money Tracker ============ -->
  <g transform="translate(30, 30)">
    <g class="card-item">
      <!-- Card Frame -->
      <rect width="555" height="280" rx="16" fill="url(#cardBg)" stroke="#272152" stroke-width="1.5"/>
      <rect width="555" height="4" rx="2" fill="url(#accMoney)"/>
      
      <!-- Header Icon and Title -->
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#15243a" stroke="#00cec9" stroke-width="1"/>
      <text x="45" y="51" text-anchor="middle" font-size="20">💰</text>
      
      <text x="78" y="44" class="title">Money Tracker</text>
      <rect x="78" y="52" width="76" height="18" rx="9" fill="url(#accMoney)"/>
      <text x="116" y="65" text-anchor="middle" class="badge-text">FLAGSHIP</text>

      <!-- Description -->
      <text x="25" y="105" class="desc">
        <tspan x="25" dy="0">AI-powered personal finance system featuring smart categorization,</tspan>
        <tspan x="25" dy="20">budget coaching, and recurring subscription intelligence.</tspan>
        <tspan x="25" dy="20">Shipped as a FastAPI backend, PostgreSQL database, and a</tspan>
        <tspan x="25" dy="20">native Android client built entirely in Jetpack Compose.</tspan>
      </text>

      <!-- Visual Dashboard Component (Right Side) -->
      <g transform="translate(390, 25)">
        <rect width="140" height="140" rx="10" fill="#09061a" stroke="#1d1742" stroke-width="1.2"/>
        <text x="10" y="18" class="vis-title">EXPENSE INDEX</text>
        <!-- Line Chart -->
        <path d="M 15 110 Q 35 90 55 95 T 95 55 T 125 45" fill="none" stroke="#00cec9" stroke-width="2.5"/>
        <path d="M 15 110 Q 35 90 55 95 T 95 55 T 125 45 L 125 125 L 15 125 Z" fill="url(#chartGlow)" opacity="0.6"/>
        <!-- Pulsing Node -->
        <circle cx="125" cy="45" r="4" fill="#00cec9" filter="url(#neon)"/>
        <circle cx="125" cy="45" r="8" fill="none" stroke="#00cec9" stroke-width="1" class="pulse-node"/>
        <!-- Small metric -->
        <text x="10" y="130" font-family="'Fira Code', monospace" font-size="9" fill="#00cec9">$1,248.50</text>
        <text x="130" y="130" font-family="'Fira Code', monospace" font-size="9" fill="#8a86c9" text-anchor="end">ACTIVE</text>
      </g>

      <!-- Tags -->
      <g transform="translate(25, 215)">
        <!-- Tag 1 -->
        <rect width="70" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="35" y="16" text-anchor="middle" class="tag-text">FastAPI</text>
        <!-- Tag 2 -->
        <rect x="78" width="90" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="123" y="16" text-anchor="middle" class="tag-text">PostgreSQL</text>
        <!-- Tag 3 -->
        <rect x="176" width="65" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="208.5" y="16" text-anchor="middle" class="tag-text">Kotlin</text>
        <!-- Tag 4 -->
        <rect x="249" width="125" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="311.5" y="16" text-anchor="middle" class="tag-text">Jetpack Compose</text>
      </g>
    </g>
  </g>

  <!-- ============ CARD 2 : Trustflow AI ============ -->
  <g transform="translate(615, 30)">
    <g class="card-item">
      <!-- Card Frame -->
      <rect width="555" height="280" rx="16" fill="url(#cardBg)" stroke="#272152" stroke-width="1.5"/>
      <rect width="555" height="4" rx="2" fill="url(#accTrust)"/>
      
      <!-- Header Icon and Title -->
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#2d2122" stroke="#e17055" stroke-width="1"/>
      <text x="45" y="51" text-anchor="middle" font-size="20">🔐</text>
      
      <text x="78" y="44" class="title">Trustflow AI</text>
      <rect x="78" y="52" width="70" height="18" rx="9" fill="url(#accTrust)"/>
      <text x="113" y="65" text-anchor="middle" class="badge-text">NEWEST</text>

      <!-- Description -->
      <text x="25" y="105" class="desc">
        <tspan x="25" dy="0">An explainable AI trust and verification engine built to audit,</tspan>
        <tspan x="25" dy="20">score, and monitor data workflows. Designed for enterprises to</tspan>
        <tspan x="25" dy="20">visualize model reliability, prevent data poisoning, and ensure</tspan>
        <tspan x="25" dy="20">strict compliance on production AI execution pipelines.</tspan>
      </text>

      <!-- Visual Dashboard Component (Right Side) -->
      <g transform="translate(390, 25)">
        <rect width="140" height="140" rx="10" fill="#09061a" stroke="#1d1742" stroke-width="1.2"/>
        <text x="10" y="18" class="vis-title">AUDIT ENGINE</text>
        <!-- Flow Nodes -->
        <g transform="translate(10, 20)">
          <!-- Line connections -->
          <path d="M 60 20 L 60 50 M 60 50 L 30 85 M 60 50 L 90 85" stroke="#3e387c" stroke-width="1.5"/>
          <!-- Node 1 -->
          <circle cx="60" cy="20" r="10" fill="#1b1440" stroke="#e17055" stroke-width="1.5"/>
          <text x="60" y="23" font-family="'Fira Code', monospace" font-size="7" fill="#fff" text-anchor="middle">IN</text>
          <!-- Node 2 (Verification Gate) -->
          <circle cx="60" cy="50" r="12" fill="#1b1440" stroke="#fdcb6e" stroke-width="1.5"/>
          <path d="M 57 50 L 59 52 L 63 48" fill="none" stroke="#fdcb6e" stroke-width="1.5" class="pulse-node"/>
          <!-- Leaf Nodes -->
          <circle cx="30" cy="85" r="8" fill="#09061a" stroke="#3e387c" stroke-width="1.5"/>
          <circle cx="90" cy="85" r="8" fill="#09061a" stroke="#3e387c" stroke-width="1.5"/>
          <circle cx="30" cy="85" r="2" fill="#e17055"/>
          <circle cx="90" cy="85" r="2" fill="#e17055"/>
        </g>
        <!-- Trust index output -->
        <text x="70" y="130" font-family="'Fira Code', monospace" font-size="9" fill="#fdcb6e" text-anchor="middle">TRUST SCORE: 99.8%</text>
      </g>

      <!-- Tags -->
      <g transform="translate(25, 215)">
        <!-- Tag 1 -->
        <rect width="65" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="32.5" y="16" text-anchor="middle" class="tag-text">Python</text>
        <!-- Tag 2 -->
        <rect x="73" width="70" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="108" y="16" text-anchor="middle" class="tag-text">PyTorch</text>
        <!-- Tag 3 -->
        <rect x="151" width="105" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="203.5" y="16" text-anchor="middle" class="tag-text">Explainable AI</text>
      </g>
    </g>
  </g>

  <!-- ============ CARD 3 : AI Plant Doctor ============ -->
  <g transform="translate(30, 330)">
    <g class="card-item">
      <!-- Card Frame -->
      <rect width="555" height="280" rx="16" fill="url(#cardBg)" stroke="#272152" stroke-width="1.5"/>
      <rect width="555" height="4" rx="2" fill="url(#accPlant)"/>
      
      <!-- Header Icon and Title -->
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#132a24" stroke="#00b894" stroke-width="1"/>
      <text x="45" y="51" text-anchor="middle" font-size="20">🌱</text>
      
      <text x="78" y="44" class="title">AI Plant Doctor</text>
      <rect x="78" y="52" width="145" height="18" rx="9" fill="url(#accPlant)"/>
      <text x="150.5" y="65" text-anchor="middle" class="badge-text">🥇 1ST PLACE - AGRITECH</text>

      <!-- Description -->
      <text x="25" y="105" class="desc">
        <tspan x="25" dy="0">Computer-vision solution enabling farmers to diagnose plant diseases</tspan>
        <tspan x="25" dy="20">instantly from a photo and receive actionable botanical prescriptions.</tspan>
        <tspan x="25" dy="20">Won Best UI/UX and ranked #4 out of 150+ teams at the</tspan>
        <tspan x="25" dy="20">Code Crafter 3.0 National Hackathon.</tspan>
      </text>

      <!-- Visual Dashboard Component (Right Side) -->
      <g transform="translate(390, 25)">
        <rect width="140" height="140" rx="10" fill="#09061a" stroke="#1d1742" stroke-width="1.2"/>
        <text x="10" y="18" class="vis-title">VISION DIAGNOSIS</text>
        <!-- Leaf drawing inside visualizer -->
        <g transform="translate(45, 45)">
          <path d="M 25 10 C 50 10 55 45 25 65 C -5 45 0 10 25 10 Z" fill="#00b894" opacity="0.3" stroke="#00b894" stroke-width="1.5"/>
          <path d="M 25 10 L 25 65" stroke="#00b894" stroke-width="1"/>
          <path d="M 25 25 L 35 20 M 25 35 L 15 32 M 25 45 L 37 40" stroke="#00b894" stroke-width="1"/>
        </g>
        <!-- Scanning box -->
        <rect x="25" y="35" width="90" height="80" rx="4" fill="none" stroke="#55efc4" stroke-width="1" stroke-dasharray="3"/>
        <!-- Scanning Laser -->
        <line class="scanner-line" x1="26" y1="35" x2="114" y2="35" stroke="#55efc4" stroke-width="1.5" filter="url(#neon)"/>
        <text x="70" y="130" font-family="'Fira Code', monospace" font-size="8" fill="#55efc4" text-anchor="middle">LEAF SCAN: HEALTHY 96%</text>
      </g>

      <!-- Tags -->
      <g transform="translate(25, 215)">
        <!-- Tag 1 -->
        <rect width="65" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="32.5" y="16" text-anchor="middle" class="tag-text">Python</text>
        <!-- Tag 2 -->
        <rect x="73" width="105" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="125.5" y="16" text-anchor="middle" class="tag-text">Computer Vision</text>
        <!-- Tag 3 -->
        <rect x="186" width="85" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="228.5" y="16" text-anchor="middle" class="tag-text">TypeScript</text>
        <!-- Tag 4 -->
        <rect x="279" width="75" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="316.5" y="16" text-anchor="middle" class="tag-text">AI APIs</text>
      </g>
    </g>
  </g>

  <!-- ============ CARD 4 : Authentix ============ -->
  <g transform="translate(615, 330)">
    <g class="card-item">
      <!-- Card Frame -->
      <rect width="555" height="280" rx="16" fill="url(#cardBg)" stroke="#272152" stroke-width="1.5"/>
      <rect width="555" height="4" rx="2" fill="url(#accAuth)"/>
      
      <!-- Header Icon and Title -->
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#201f3b" stroke="#a29bfe" stroke-width="1"/>
      <text x="45" y="51" text-anchor="middle" font-size="20">🛡️</text>
      
      <text x="78" y="44" class="title">Authentix</text>
      <rect x="78" y="52" width="130" height="18" rx="9" fill="url(#accAuth)"/>
      <text x="143" y="65" text-anchor="middle" class="badge-text">MISINFO ENGINE</text>

      <!-- Description -->
      <text x="25" y="105" class="desc">
        <tspan x="25" dy="0">A digital truth-defense system designed to parse, analyze, and flag</tspan>
        <tspan x="25" dy="20">fake news, AI-generated synthetic media, and online privacy violations.</tspan>
        <tspan x="25" dy="20">Provides users with a clear, visual credibility rating to combat the</tspan>
        <tspan x="25" dy="20">spread of digital misinformation and support information literacy.</tspan>
      </text>

      <!-- Visual Dashboard Component (Right Side) -->
      <g transform="translate(390, 25)">
        <rect width="140" height="140" rx="10" fill="#09061a" stroke="#1d1742" stroke-width="1.2"/>
        <text x="10" y="18" class="vis-title">ANALYSIS DIAL</text>
        <!-- Arc meter -->
        <g transform="translate(70, 75)">
          <path d="M -40 10 A 40 40 0 1 1 40 10" fill="none" stroke="#241e54" stroke-width="6" stroke-linecap="round"/>
          <path d="M -40 10 A 40 40 0 1 1 20 -30" fill="none" stroke="#a29bfe" stroke-width="6" stroke-linecap="round" filter="url(#neon)"/>
          <!-- Pointer dial -->
          <line x1="0" y1="0" x2="15" y2="-25" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="5" fill="#a29bfe"/>
          <!-- Value text -->
          <text x="0" y="32" font-family="'Fira Code', monospace" font-weight="700" font-size="11" fill="#a29bfe" text-anchor="middle">VERIFIED</text>
        </g>
      </g>

      <!-- Tags -->
      <g transform="translate(25, 215)">
        <!-- Tag 1 -->
        <rect width="70" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="35" y="16" text-anchor="middle" class="tag-text">AI/ML</text>
        <!-- Tag 2 -->
        <rect x="78" width="60" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="108" y="16" text-anchor="middle" class="tag-text">NLP</text>
        <!-- Tag 3 -->
        <rect x="146" width="105" height="24" rx="12" fill="#181440" stroke="#3e387c" stroke-width="1"/>
        <text x="198.5" y="16" text-anchor="middle" class="tag-text">Media Auditing</text>
      </g>
    </g>
  </g>
</svg>
