<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02000a"/>
      <stop offset="50%" stop-color="#050316"/>
      <stop offset="100%" stop-color="#0d0826"/>
    </linearGradient>

    <!-- Card Background Glass -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e092b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060414" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <!-- accMoney -> Purple Indigo -->
    <linearGradient id="accMoney" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- accTrust -> Hot Magenta -->
    <linearGradient id="accTrust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- accPlant -> Plum Pink -->
    <linearGradient id="accPlant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- accAuth -> Fuchsia Violet -->
    <linearGradient id="accAuth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d164c" stroke-width="0.8" opacity="0.3"/>
    </pattern>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Outfit:wght@400;600;800&amp;display=swap');
      
      .title { 
        font-family: 'Outfit', sans-serif; 
        font-size: 24px; 
        font-weight: 800; 
        fill: #ffffff; 
      }
      
      .desc { 
        font-family: 'Outfit', sans-serif; 
        font-size: 13.5px; 
        fill: #c8c6f0; 
        line-height: 1.6;
      }
      
      .tag-text { 
        font-family: 'Fira Code', monospace; 
        font-size: 10px; 
        fill: #a29bfe; 
        font-weight: 500;
      }
      
      .badge-text { 
        font-family: 'Fira Code', monospace; 
        font-size: 10px; 
        font-weight: 700; 
        fill: #02000a; 
      }

      .vis-title {
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        fill: #8a86c9;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      /* Animations */
      @keyframes floatUpDown {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes scannerMove {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(50px); }
      }
      @keyframes signalPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.95; }
      }
      @keyframes jitterNeedle {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-2deg); }
        60% { transform: rotate(3deg); }
        80% { transform: rotate(-1deg); }
      }

      .float-holo { animation: floatUpDown 4s infinite ease-in-out; }
      .laser-line { animation: scannerMove 3.5s infinite ease-in-out; }
      .signal { animation: signalPulse 2s infinite ease-in-out; }
      .needle-move { animation: jitterNeedle 5s infinite ease-in-out; transform-origin: 70px 75px; }

      .card-item {
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      }
      .card-item:hover {
        transform: translateY(-6px);
      }
      .card-item:hover .frame-bg {
        stroke: #4d3a96;
        fill-opacity: 0.98;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- ============ CARD 1 : Money Tracker ============ -->
  <g transform="translate(30, 30)" class="card-item">
    <!-- Frame -->
    <rect class="frame-bg" width="555" height="280" rx="18" fill="url(#cardBg)" stroke="#22184a" stroke-width="1.8"/>
    <rect width="555" height="4" rx="2" fill="url(#accMoney)"/>
    
    <!-- Header Icon -->
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#0f072d" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <text x="45" y="52" text-anchor="middle" font-size="20">💰</text>
    
    <text x="78" y="44" class="title">Money Tracker</text>
    <rect x="78" y="52" width="76" height="18" rx="9" fill="url(#accMoney)"/>
    <text x="116" y="65" text-anchor="middle" class="badge-text">FLAGSHIP</text>
 
    <!-- Description -->
    <text x="25" y="110" class="desc">
      <tspan x="25" dy="0">AI personal finance coach with automated</tspan>
      <tspan x="25" dy="22">categorization and subscription engine.</tspan>
      <tspan x="25" dy="22">FastAPI &amp; PostgreSQL backend, driving a</tspan>
      <tspan x="25" dy="22">Jetpack Compose native Android client.</tspan>
    </text>
 
    <!-- 3D Holographic Chart Component -->
    <g transform="translate(390, 25)">
      <rect width="140" height="140" rx="12" fill="#060312" stroke="#1d164c" stroke-width="1.2"/>
      <text x="12" y="20" class="vis-title">EXPENSE 3D INDEX</text>
      
      <!-- Isometric Ground Grid -->
      <g stroke="#1d164c" stroke-width="0.8" fill="none">
        <path d="M 15 100 L 125 70 M 15 80 L 125 50 M 15 60 L 125 30" />
        <path d="M 15 100 L 125 100 M 15 80 L 125 80 M 15 60 L 125 60" opacity="0.3"/>
      </g>
      
      <!-- Floating 3D Bars -->
      <!-- Bar 1 (x=30, y=95) -->
      <g transform="translate(30, 95)" class="float-holo">
        <polygon points="-8,0 0,-4 8,0 0,4" fill="#a855f7" stroke="#fff" stroke-width="0.3"/>
        <polygon points="-8,0 -8,25 0,29 0,4" fill="#8b5cf6"/>
        <polygon points="0,4 0,29 8,25 8,0" fill="#7c3aed" opacity="0.8"/>
      </g>
      <!-- Bar 2 (x=65, y=75) -->
      <g transform="translate(65, 80)" class="float-holo" style="animation-delay: 0.5s;">
        <polygon points="-8,0 0,-4 8,0 0,4" fill="#c084fc" stroke="#fff" stroke-width="0.3"/>
        <polygon points="-8,0 -8,35 0,39 0,4" fill="#a855f7"/>
        <polygon points="0,4 0,39 8,35 8,0" fill="#8b5cf6" opacity="0.8"/>
      </g>
      <!-- Bar 3 (x=100, y=60) -->
      <g transform="translate(100, 68)" class="float-holo" style="animation-delay: 1s;">
        <polygon points="-8,0 0,-4 8,0 0,4" fill="#ec4899" stroke="#fff" stroke-width="0.3"/>
        <polygon points="-8,0 -8,45 0,49 0,4" fill="#d946ef"/>
        <polygon points="0,4 0,49 8,45 8,0" fill="#c026d3" opacity="0.8"/>
      </g>
      
      <!-- Glowing active target -->
      <circle cx="100" cy="68" r="4.5" fill="#ec4899" class="signal" filter="url(#subtleGlow)"/>
      
      <!-- Animated spent text -->
      <text x="12" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#ec4899" font-weight="700">
        $1,482.50
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="128" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#8a86c9" text-anchor="end" font-weight="700">ACTIVE</text>
    </g>
 
    <!-- Tags -->
    <g transform="translate(25, 220)">
      <rect width="68" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="34" y="16" text-anchor="middle" class="tag-text">FastAPI</text>
      <rect x="74" width="88" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="118" y="16" text-anchor="middle" class="tag-text">PostgreSQL</text>
      <rect x="168" width="62" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="199" y="16" text-anchor="middle" class="tag-text">Kotlin</text>
      <rect x="236" width="122" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="297" y="16" text-anchor="middle" class="tag-text">Jetpack Compose</text>
    </g>
  </g>
 
  <!-- ============ CARD 2 : Trustflow AI ============ -->
  <g transform="translate(615, 30)" class="card-item">
    <rect class="frame-bg" width="555" height="280" rx="18" fill="url(#cardBg)" stroke="#22184a" stroke-width="1.8"/>
    <rect width="555" height="4" rx="2" fill="url(#accTrust)"/>
    
    <!-- Header Icon -->
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#0f072d" stroke="#ec4899" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <text x="45" y="52" text-anchor="middle" font-size="20">🔐</text>
    
    <text x="78" y="44" class="title">Trustflow AI</text>
    <rect x="78" y="52" width="70" height="18" rx="9" fill="url(#accTrust)"/>
    <text x="113" y="65" text-anchor="middle" class="badge-text">NEWEST</text>
 
    <!-- Description -->
    <text x="25" y="110" class="desc">
      <tspan x="25" dy="0">Explainable AI framework designed to</tspan>
      <tspan x="25" dy="22">audit and trace complex neural data flows.</tspan>
      <tspan x="25" dy="22">Detects adversarial input poisoning and</tspan>
      <tspan x="25" dy="22">guarantees compliance under strict loads.</tspan>
    </text>
 
    <!-- 3D Layered Node Network Component -->
    <g transform="translate(390, 25)">
      <rect width="140" height="140" rx="12" fill="#060312" stroke="#1d164c" stroke-width="1.2"/>
      <text x="12" y="20" class="vis-title">3D AUDIT STACK</text>
      
      <!-- Layer 1: Data Plane -->
      <g transform="translate(70, 105)" class="float-holo">
        <!-- Plane Outline -->
        <polygon points="-42,0 0,-16 42,0 0,16" fill="none" stroke="#4a226d" stroke-width="1.2" opacity="0.6"/>
        <!-- Nodes -->
        <circle cx="-20" cy="0" r="3.5" fill="#ec4899" filter="url(#subtleGlow)"/>
        <circle cx="20" cy="0" r="3.5" fill="#ec4899"/>
      </g>
      
      <!-- Layer 2: Model Plane (elevated) -->
      <g transform="translate(70, 50)" class="float-holo" style="animation-delay: 0.8s;">
        <polygon points="-42,0 0,-16 42,0 0,16" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>
        <!-- Decision Center Node -->
        <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#subtleGlow)"/>
        <circle cx="0" cy="0" r="9" fill="none" stroke="#c084fc" stroke-width="1" class="signal"/>
      </g>
 
      <!-- Connecting 3D Paths -->
      <g stroke="#8a86c9" stroke-width="1.2" opacity="0.45" stroke-dasharray="2" fill="none">
        <path id="pathLeft" d="M 50,105 L 70,50"/>
        <path id="pathRight" d="M 90,105 L 70,50"/>
      </g>
      
      <!-- Animated Data Packets Flowing -->
      <circle r="3" fill="#c084fc">
        <animateMotion dur="2.5s" repeatCount="indefinite">
          <mpath href="#pathLeft"/>
        </animateMotion>
      </circle>
      <circle r="3" fill="#ec4899">
        <animateMotion dur="2s" repeatCount="indefinite" begin="1s">
          <mpath href="#pathRight"/>
        </animateMotion>
      </circle>
      
      <text x="70" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#c084fc" text-anchor="middle" font-weight="700">INTEGRITY: 99.9%</text>
    </g>

    <!-- Tags -->
    <g transform="translate(25, 220)">
      <rect width="65" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">Python</text>
      <rect x="71" width="70" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="106" y="16" text-anchor="middle" class="tag-text">PyTorch</text>
      <rect x="147" width="105" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="199.5" y="16" text-anchor="middle" class="tag-text">Explainable AI</text>
    </g>
  </g>

  <!-- ============ CARD 3 : AI Plant Doctor ============ -->
  <g transform="translate(30, 330)" class="card-item">
    <rect class="frame-bg" width="555" height="280" rx="18" fill="url(#cardBg)" stroke="#22184a" stroke-width="1.8"/>
    <rect width="555" height="4" rx="2" fill="url(#accPlant)"/>
    
    <!-- Header Icon -->
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#0e0628" stroke="#c084fc" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <text x="45" y="52" text-anchor="middle" font-size="20">🌱</text>
    
    <text x="78" y="44" class="title">AI Plant Doctor</text>
    <rect x="78" y="52" width="145" height="18" rx="9" fill="url(#accPlant)"/>
    <text x="150.5" y="65" text-anchor="middle" class="badge-text">🥇 1ST PLACE - AGRITECH</text>
 
    <!-- Description -->
    <text x="25" y="110" class="desc">
      <tspan x="25" dy="0">Computer-vision system designed to</tspan>
      <tspan x="25" dy="22">diagnose plant crop diseases from a photo.</tspan>
      <tspan x="25" dy="22">Won Best UI/UX &amp; ranked #4 / 150+ at</tspan>
      <tspan x="25" dy="22">Code Crafter 3.0 National Hackathon.</tspan>
    </text>
 
    <!-- 3D Holographic Leaf Scanner Component -->
    <g transform="translate(390, 25)">
      <rect width="140" height="140" rx="12" fill="#060312" stroke="#1d164c" stroke-width="1.2"/>
      <text x="12" y="20" class="vis-title">HOLOGRAM SCANNER</text>
      
      <!-- Projection Cone -->
      <polygon points="70,110 35,65 105,65" fill="url(#accPlant)" opacity="0.1"/>
      
      <!-- Base Projection Platform -->
      <polygon points="35,110 70,100 105,110 70,120" fill="#081e18" stroke="#ec4899" stroke-width="1"/>
      <polygon points="35,110 35,114 70,124 105,114 105,110 Z" fill="#030d0a"/>
      
      <!-- Floating Leaf Model -->
      <g transform="translate(70, 60)" class="float-holo">
        <path d="M 0,-18 C 15,-18 18,10 0,22 C -18,10 -15,-18 0,-18 Z" fill="#8b5cf6" fill-opacity="0.35" stroke="#c084fc" stroke-width="1.2" filter="url(#subtleGlow)"/>
        <line x1="0" y1="-18" x2="0" y2="22" stroke="#c084fc" stroke-width="0.8"/>
      </g>
      
      <!-- Animated Laser Scanline -->
      <g transform="translate(70, 60)">
        <line class="laser-line" x1="-22" y1="-15" x2="22" y2="-15" stroke="#ec4899" stroke-width="1.5" filter="url(#neon)"/>
      </g>
      
      <text x="70" y="128" font-family="'Fira Code', monospace" font-size="8" fill="#c084fc" text-anchor="middle" font-weight="700">DIAGNOSIS: HEALTHY 98%</text>
    </g>
 
    <!-- Tags -->
    <g transform="translate(25, 220)">
      <rect width="65" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">Python</text>
      <rect x="71" width="105" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="123.5" y="16" text-anchor="middle" class="tag-text">Computer Vision</text>
      <rect x="182" width="80" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="222" y="16" text-anchor="middle" class="tag-text">TypeScript</text>
      <rect x="268" width="70" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="303" y="16" text-anchor="middle" class="tag-text">AI APIs</text>
    </g>
  </g>
 
  <!-- ============ CARD 4 : Authentix ============ -->
  <g transform="translate(615, 330)" class="card-item">
    <rect class="frame-bg" width="555" height="280" rx="18" fill="url(#cardBg)" stroke="#22184a" stroke-width="1.8"/>
    <rect width="555" height="4" rx="2" fill="url(#accAuth)"/>
    
    <!-- Header Icon -->
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#1a133a" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <text x="45" y="52" text-anchor="middle" font-size="20">🛡️</text>
    
    <text x="78" y="44" class="title">Authentix</text>
    <rect x="78" y="52" width="130" height="18" rx="9" fill="url(#accAuth)"/>
    <text x="143" y="65" text-anchor="middle" class="badge-text">MISINFO ENGINE</text>
 
    <!-- Description -->
    <text x="25" y="110" class="desc">
      <tspan x="25" dy="0">Deep-learning model built to inspect</tspan>
      <tspan x="25" dy="22">media feeds to detect deepfakes &amp; spam.</tspan>
      <tspan x="25" dy="22">Provides authenticity scores by analyzing</tspan>
      <tspan x="25" dy="22">semantic tone &amp; neural text patterns.</tspan>
    </text>
 
    <!-- 3D Dial Gauge Component -->
    <g transform="translate(390, 25)">
      <rect width="140" height="140" rx="12" fill="#060312" stroke="#1d164c" stroke-width="1.2"/>
      <text x="12" y="20" class="vis-title">ANALYSIS METRIC</text>
      
      <!-- 3D Tilted Gauge face -->
      <g transform="translate(70, 75) rotate(-10) skewX(10)">
        <!-- Back plate shadow -->
        <ellipse cx="0" cy="5" rx="38" ry="24" fill="#000" opacity="0.4"/>
        
        <!-- Dial Outer Arch -->
        <path d="M -35,5 A 35,20 0 1,1 35,5" fill="none" stroke="#1d164c" stroke-width="6" stroke-linecap="round"/>
        <path d="M -35,5 A 35,20 0 1,1 15,-13" fill="none" stroke="url(#accAuth)" stroke-width="6" stroke-linecap="round" filter="url(#subtleGlow)"/>
        
        <!-- Center Knob -->
        <ellipse cx="0" cy="0" rx="8" ry="5" fill="#6c5ce7"/>
        
        <!-- Pointer Needle (Jitter Animation for Realtime effect) -->
        <g class="needle-move">
          <line x1="0" y1="0" x2="20" y2="-15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)"/>
        </g>
      </g>
      
      <text x="70" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#a855f7" text-anchor="middle" font-weight="700">RATING: GENUINE</text>
    </g>
 
    <!-- Tags -->
    <g transform="translate(25, 220)">
      <rect width="70" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" class="tag-text">AI/ML</text>
      <rect x="76" width="60" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="106" y="16" text-anchor="middle" class="tag-text">NLP</text>
      <rect x="142" width="105" height="24" rx="12" fill="#150a3a" stroke="#4a3e9c" stroke-width="1"/>
      <text x="194.5" y="16" text-anchor="middle" class="tag-text">Media Auditing</text>
    </g>
  </g>
</svg>
